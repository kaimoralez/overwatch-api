<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch Tactical Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-content">
            <h1>OVERWATCH <span>TACTICAL HUB</span></h1>
            <a href="/swagger-ui.html" target="_blank" class="btn-swagger">Documentação Swagger ↗</a>
        </div>
    </header>

    <main class="container">
        <nav class="tabs" aria-label="Entidades do sistema">
            <button class="tab-btn active" data-entity="herois">Heróis</button>
            <button class="tab-btn" data-entity="jogadores">Jogadores</button>
            <button class="tab-btn" data-entity="equipes">Equipes</button>
            <button class="tab-btn" data-entity="mapas">Mapas</button>
            <button class="tab-btn" data-entity="partidas">Partidas</button>
        </nav>

        <div id="status-banner" class="status-banner hidden" role="alert"></div>

        <section class="workspace">
            <div class="card form-card">
                <h2 id="form-title">Cadastrar Novo Registro</h2>
                <form id="entity-form">
                    <input type="hidden" id="record-id">
                    <div id="dynamic-fields"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="btn-submit">Salvar</button>
                        <button type="button" class="btn-secondary hidden" id="btn-cancel">Cancelar Edição</button>
                    </div>
                </form>
            </div>

            <div class="card list-card">
                <div class="list-header">
                    <h2 id="list-title">Registros Cadastrados</h2>
                    <button type="button" class="btn-refresh" id="btn-refresh">Atualizar Lista</button>
                </div>

                <div id="loading-state" class="state-box hidden">Carregando dados da API...</div>
                <div id="empty-state" class="state-box hidden">Nenhum registro encontrado nesta categoria.</div>

                <div class="table-wrapper">
                    <table id="data-table">
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
